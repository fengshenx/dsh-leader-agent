name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 与发版同一条链路：门禁、客户端构建、发布包内容。PR 上就拦住「发出去缺文件」。
      - run: npm run release:check
