name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读：CI 跑的是仓里的脚本与单测，不需要写权限。仓库默认 token 权限设成 write 时，
# 不声明就等于把写权限交给任何改脚本的 PR。
permissions:
  contents: read

# 同一 PR 连续推送时取消旧 run：两个矩阵跑完后，先发的旧结论可能后完成，
# 把最新一次推送的结果盖掉。main 的 push 不取消——判定合并结果的就是跑完的那次。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 下限与 package.json 的 engines.node 同一来源：只跑最新 24.x 时，用了更高
        # 版本才有的 API 也发现不了，按声明下限装的用户拿到运行期 TypeError。
        node: ['24.9.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # 与发版同一条链路：门禁、客户端构建、发布包内容。PR 上就拦住「发出去缺文件」。
      - run: npm run release:check

  # 分支规则的 required check 只认这一个名字。矩阵按 Node 版本展开成
  # `check (24.9.0)` / `check (24)`，直接把它们设成必需项的话，改 matrix 的当天
  # 门禁名就跟着漂移，所有 PR 会一直等一个不会再出现的 check。
  ci-ok:
    name: ci-ok
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "matrix job 结果：${{ needs.check.result }}" >&2
            exit 1
          fi
