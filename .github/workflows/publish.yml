name: Publish

# 发版入口：改 package.json 的 version → 提交 → 打 tag `v<version>` → push tag。
# 门禁挂在本包的 `prepublishOnly`（= npm run release:check），手动发布与 CI 走同一条链路。
# 认证走 npm trusted publishing（OIDC）：仓库不存发布 token，身份由本次 workflow 换取短期凭证。
on:
  push:
    tags: ['v*']

permissions:
  # 建 GitHub Release 用 GITHUB_TOKEN
  contents: write
  # 向 npm 换 OIDC 短期发布凭证，并生成 provenance
  id-token: write

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # pin 到完整 commit SHA：浮动 tag 被上游 retag 后，新代码在发布前就能拿到发布权限
      #（OIDC 身份 + contents: write），而 npm 版本不可回收。注释里的版本号供人读。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # 最先拦这一条，也省掉一次 npm ci：tag 与 version 不一致时，npm 会把新版本
      # 发在错误的 tag 上，之后只能靠 deprecated 收场。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 package.json 的 v${version} 不一致：先改版本再打 tag" >&2
            exit 1
          fi

      # 版本一致只说明 tag 名字对：从 feature 分支打的 tag 同样一致，但那次提交没
      # 经过 main 上的 release:check。发出去不可回收，所以位置也要验。
      - name: 校验 tag 提交在 main 上
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "${GITHUB_REF_NAME} 指向的提交不在 origin/main 上：先合进 main 再打 tag" >&2
            exit 1
          fi

      # 不写 registry-url：它会往 .npmrc 写 _authToken=${NODE_AUTH_TOKEN}，
      # 空值会先于 OIDC 身份被 npm 读到。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      # OIDC 发布要求 npm CLI ≥ 11.5.1；OIDC 下切 dist-tag 要求 ≥ 11.21 / 12.2。
      # 钉具体版本而不是 @latest：与 actions 钉 SHA 同一条理由——发布前不该从浮动
      # tag 拉到一份没人审阅过的代码，而 npm 版本不可回收。11.21.0 同时满足两个门槛。
      - run: npm install -g npm@11.21.0 --no-fund --no-audit

      - run: npm ci

      # 认证来自 trusted publishing：npmjs.com 上该包已登记本仓库与 workflow 文件名
      #（publish.yml），并勾选允许 npm publish；仓库里没有 NPM_TOKEN。
      # 版本已存在时跳过发布，保证「发布成功但建 Release 失败」后能直接重跑；
      # 预发布版走 next dist-tag（不带 --tag 会把 rc 顶到 latest）。
      - name: 发布到 npm
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} 已发布，跳过 npm publish"
            exit 0
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"

      - name: 建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} 已存在，跳过"
            exit 0
          fi
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
